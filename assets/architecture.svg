 <rect x="20" y="265" width="180" height="62" rx="10" fill="#dbe7fd" stroke="#2563eb"/><text x="110" y="292" font-weight="700">WireGuard users</text><text x="110" y="313" fill="#5d6672">UDP 51820</text>
