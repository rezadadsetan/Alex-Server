<rect x="240" y="62" width="610" height="430" rx="16" fill="#fff" stroke="#d9dde3" stroke-width="1.5"/>
<text x="545" y="88" text-anchor="middle" font-size="15" font-weight="700">Iran VPS · Ubuntu 24.04</text>
<g font-size="12" text-anchor="middle">
 <rect x="265" y="108" width="190" height="76" rx="9" fill="#d5f2e7" stroke="#047857"/><text x="360" y="134" font-weight="700">3x-ui + pinned Xray</text><text x="360" y="154" fill="#5d6672">Reality · DoH · sniffing</text><text x="360" y="172" fill="#5d6672">outbound mark 0x200</text>
 <rect x="265" y="207" width="190" height="67" rx="9" fill="#fbead3" stroke="#b45309"/><text x="360" y="234" font-weight="700">strongSwan + xl2tpd</text><text x="360" y="255" fill="#5d6672">10.203.62.0/24</text>
 <rect x="265" y="297" width="190" height="67" rx="9" fill="#dbe7fd" stroke="#2563eb"/><text x="360" y="324" font-weight="700">wg-clients</text><text x="360" y="345" fill="#5d6672">10.203.61.0/24</text>
 <rect x="265" y="392" width="190" height="78" rx="9" fill="#d9f4f8" stroke="#0891b2"/><text x="360" y="418" font-weight="700">RDnet Bot service</text><text x="360" y="439" fill="#5d6672">Telegram proxy</text><text x="360" y="457" fill="#5d6672">127.0.0.1:10808</text>
 <rect x="495" y="108" width="155" height="262" rx="10" fill="#ebe2fd" stroke="#7c3aed"/><text x="572" y="136" font-weight="700">Fail-closed routing</text><text x="572" y="160" fill="#5d6672">mark 0x200 / subnets</text><text x="572" y="185" fill="#5d6672">↓</text><text x="572" y="210" font-weight="700">table 200</text><text x="572" y="232" fill="#5d6672">default → wg-out</text><text x="572" y="252" fill="#5d6672">fallback → blackhole</text><text x="572" y="288" font-weight="700">nftables kill switch</text><text x="572" y="312" fill="#5d6672">no Iran fallback</text><text x="572" y="334" fill="#5d6672">IPv6 drop</text>
 <rect x="680" y="108" width="145" height="262" rx="10" fill="#eee9fb" stroke="#7c3aed"/><text x="752" y="136" font-weight="700">wg-out</text><text x="752" y="160" fill="#5d6672">10.203.70.2/30</text><text x="752" y="181" fill="#5d6672">fixed UDP 54455</text><text x="752" y="220" font-weight="700">Auto recovery</text><text x="752" y="244" fill="#5d6672">watchdog every 60s</text><text x="752" y="266" fill="#5d6672">stale &gt; 180s</text><text x="752" y="288" fill="#5d6672">restart wg-out</text><text x="752" y="330" fill="#5d6672">keepalive 25s</text><text x="752" y="350" fill="#5d6672">Table = off</text>
 <rect x="495" y="392" width="330" height="78" rx="9" fill="#e9edf2" stroke="#64748b"/><text x="660" y="418" font-weight="700">alex-stack.target · automatic boot</text><text x="660" y="440" fill="#5d6672">network → firewall/routing → wg-out</text><text x="660" y="459" fill="#5d6672">Xray → bot → health/usage/backup timers</text>
</g>

